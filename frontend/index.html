<!DOCTYPE html>
<html>
<head>
  <title>HireBoost AI</title>
  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      margin: 0;
      color: #111827;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 42px;
      margin: 0;
    }

    .subtitle {
      color: #6b7280;
      font-size: 18px;
      margin-top: 10px;
      max-width: 750px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      margin-top: 30px;
    }

    label {
      font-weight: 700;
      display: block;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 230px;
      padding: 14px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      margin-top: 25px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 26px;
      font-size: 17px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      background: #1d4ed8;
    }

    .copy-btn {
      background: #111827;
      margin-left: 10px;
    }

    .copy-btn:hover {
      background: #374151;
    }

    #result {
      margin-top: 30px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 24px;
      border-radius: 14px;
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.7;
      min-height: 80px;
    }

    .footer {
      margin-top: 25px;
      color: #6b7280;
      font-size: 14px;
    }

    #result div {
      margin-bottom: 22px !important;
    }

    #result h3 {
     margin-bottom: 8px;
    }

    #result p,
    #result pre {
      margin-top: 0;
      margin-bottom: 0;
      white-space: pre-wrap;
      font-family: system-ui, Arial, sans-serif;
      line-height: 1.5;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 34px;
      }

      .copy-btn {
        margin-left: 0;
        display: block;
      }
    }

    input[type="file"] {
      margin-bottom: 12px;
      display: block;
      }

    .status-box {
      margin-top: 22px;
      background: #ecfdf5;
      border: 1px solid #bbf7d0;
      color: #065f46;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }

    .status-box {
      margin-top: 22px;
      background: #ecfdf5;
      border: 1px solid #bbf7d0;
      color: #065f46;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .secondary-btn {
      background: #6b7280;
      margin-left: 10px;
    }

    .secondary-btn:hover {
      background: #4b5563;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="badge">AI Resume Analyzer</div>

    <h1>HireBoost AI</h1>

    <p class="subtitle">
      Paste your resume and job description to get an ATS score, resume improvement points,
      interview questions, and a recruiter message.
    </p>

    <div class="grid">
      <div>
        <label>Resume</label>
        <textarea id="resume" placeholder="Paste your resume here"></textarea>

        <br><br>
        <input type="file" id="resumeFile" accept=".pdf,.docx,.txt" onchange="uploadResumePDF()">
      </div>

      <div>
        <label>Job Description</label>
        <textarea id="job" placeholder="Paste the job description here"></textarea>
      </div>
    </div>

    <button onclick="analyze()">Analyze Resume</button>
    <button onclick="copyResult()" class="copy-btn">Copy Result</button>
    <button onclick="clearAll()" class="secondary-btn">Clear All</button>

    <div id="validationStatus" class="status-box">
      Upload a resume and paste a job description to validate.
    </div>

    <pre id="result">Your analysis will appear here.</pre>

    <div class="footer">
      MVP Version 1.0 · Built for job seekers
    </div>
  </div>

  <script>
    async function analyze() {
      const resumeBox = document.getElementById("resume");
      const resume = resumeBox.dataset.extractedText || resumeBox.value;
      const statusBox = document.getElementById("validationStatus");
      const job = document.getElementById("job").value;
      const resultBox = document.getElementById("result");
      const fileType =
        document.getElementById("resumeFile")
          .files[0]
          ?.name.split(".")

    .pop()
    .toUpperCase() || "Manual Text";

      if (!resume || !job) {
        resultBox.innerText = "Please paste both resume and job description.";
        return;
      }

      statusBox.innerHTML = `
        <strong>Validating inputs...</strong><br>
        Resume detected: Checking...<br>
        Job description detected: Checking...<br>
        File type: ${document.getElementById("resumeFile").files[0]?.name.split(".").pop().toUpperCase() || "Manual Text"}<br>
        Status: Processing...
      `;

      resultBox.innerText = "Analyzing your resume...";

      const startTime = Date.now();

      const timer = setInterval(() => {
        const seconds = ((Date.now() - startTime) / 1000).toFixed(1);

        document.getElementById("validationStatus").innerHTML = `
          <strong>Validating inputs...</strong><br>
          Resume detected: Checking...<br>
          Job description detected: Checking...<br>
          File type: ${fileType || "Unknown"}<br>
          Status: Processing... (${seconds}s)
        `;
      }, 100);

      const res = await fetch("http://localhost:8080/analyze", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          resume_text: resume,
          job_desc: job
        })
      });

      const data = await res.json();

      if (!res.ok) {
        clearInterval(timer);

        statusBox.className = "status-box error-box";
        statusBox.innerHTML = `
          <strong>Validation failed</strong><br>
          Resume detected: No<br>
          Job description detected: Not completed<br>
          File type: ${fileType}<br>
          Status: ${data.error || "Invalid input"}
        `;

        resultBox.innerText = data.error || "Invalid input.";
        return;
      }

      clearInterval(timer);

      const totalSeconds = ((Date.now() - startTime) / 1000).toFixed(1);

      statusBox.className = "status-box";
      statusBox.innerHTML = `
        <strong>Validation complete</strong><br>
        Resume detected: Yes<br>
        Job description detected: Yes<br>
        File type: ${document.getElementById("resumeFile").files[0]?.name.split(".").pop().toUpperCase() || "Manual Text"}<br>
        Status: Analysis completed in ${totalSeconds}s
      `;

      const sections = data.result;

resultBox.innerHTML = `
  <div>
    <h3>ATS Score</h3>
    <p>${sections.match(/ATS Score:.*$/m)?.[0] || ""}</p>
  </div>

  <div>
    <h3>Resume Match Summary</h3>
    <p>${sections.split("Resume Match Summary:")[1]?.split("Top Resume Improvements:")[0] || ""}</p>
  </div>

  <div>
    <h3>Improvements</h3>
    <pre>${sections.split("Top Resume Improvements:")[1]?.split("Interview Questions:")[0] || ""}</pre>
  </div>

  <div>
    <h3>Interview Questions</h3>
    <pre>${sections.split("Interview Questions:")[1]?.split("LinkedIn Recruiter Message:")[0] || ""}</pre>
  </div>

  <div>
    <h3>LinkedIn Message</h3>
    <p>${sections.split("LinkedIn Recruiter Message:")[1] || ""}</p>
  </div>
`;
    }

    function copyResult() {
      const result = document.getElementById("result").innerText;
      navigator.clipboard.writeText(result);
      alert("Result copied!");
    }

async function uploadResumePDF() {
  const fileInput = document.getElementById("resumeFile");
  const resultBox = document.getElementById("result");

  if (!fileInput.files.length) {
    return;
  }

  const formData = new FormData();
  formData.append("resume", fileInput.files[0]);

  resultBox.innerText = "Reading resume file...";

  const res = await fetch("http://localhost:8080/upload-resume", {
    method: "POST",
    body: formData
  });

  if (!res.ok) {
    resultBox.innerText = "Could not read file. Try another resume.";

    document.getElementById("validationStatus").className = "status-box error-box";
    document.getElementById("validationStatus").innerHTML = `
      <strong>Upload failed</strong><br>
      Please upload a valid PDF, DOCX, or TXT resume file.
    `;

    return;
  }

  const data = await res.json();

  const file = fileInput.files[0];
  const fileType = file.name.split(".").pop().toUpperCase();

  document.getElementById("resume").value = "[Resume file uploaded successfully]";
  document.getElementById("resume").dataset.extractedText = data.text;

  resultBox.innerText = "Resume loaded successfully. Now paste job description and click Analyze.";

  document.getElementById("validationStatus").className = "status-box";

  document.getElementById("validationStatus").innerHTML = `
    <strong>Resume uploaded successfully</strong><br>
    File name: ${file.name}<br>
    File type: ${fileType}<br>
    Status: Ready for job description
  `;
}

function clearAll() {
  document.getElementById("resume").value = "";
  document.getElementById("resume").dataset.extractedText = "";
  document.getElementById("job").value = "";
  document.getElementById("resumeFile").value = "";
  document.getElementById("result").innerText = "Your analysis will appear here.";

  const statusBox = document.getElementById("validationStatus");
  statusBox.className = "status-box";
  statusBox.innerHTML = "Upload a resume and paste a job description to validate.";
}
  </script>
</body>
</html>
